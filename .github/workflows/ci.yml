name: CI

# Lightweight checks only. This workflow never deploys.
on:
  push:
    branches: [v2-dev]
  pull_request:
    branches: [v2-dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repo checks (JS syntax + frontend structure)
        run: npm run check
      - name: Unit tests
        run: npm test
