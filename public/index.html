<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Poster - 條形屏編排台</title>
    <style>
        :root {
            color-scheme: light;
            --page: #f4f0df;
            --ink: #1d2554;
            --ink-soft: #344071;
            --line: #1d2554;
            --panel: rgba(255, 255, 255, 0.32);
            --panel-strong: rgba(255, 255, 255, 0.58);
            --accent: #2563eb;
            --danger: #dc2626;
            --muted: #70789b;
            --shadow: 0 18px 50px rgba(29, 37, 84, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 18% 8%, rgba(255, 255, 255, 0.62), transparent 22%),
                linear-gradient(180deg, #fbf8ec 0%, var(--page) 100%);
            color: var(--ink);
            font-family: "Segoe UI", "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        .studio {
            width: min(1120px, calc(100vw - 32px));
            min-height: 100vh;
            margin: 0 auto;
            padding: 20px 0 20px;
            display: grid;
            grid-template-rows: repeat(5, auto);
            align-content: start;
            gap: 10px;
        }

        .title {
            margin: 0;
            text-align: center;
            font-family: "Bradley Hand", "Comic Sans MS", "Segoe Print", cursive;
            font-size: clamp(38px, 5.2vw, 58px);
            font-weight: 500;
            line-height: 1;
            letter-spacing: 0;
        }

        .preview-frame {
            width: min(960px, 100%);
            min-height: var(--preview-frame-height, 178px);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 44px;
            overflow-x: auto;
            overflow-y: hidden;
            border: 3px solid var(--line);
            background: rgba(255, 255, 255, 0.18);
            box-shadow: var(--shadow);
            scroll-behavior: smooth;
            scrollbar-color: rgba(29, 37, 84, 0.34) rgba(255, 255, 255, 0.28);
        }

        .preview-frame::-webkit-scrollbar,
        .editor-preview-frame::-webkit-scrollbar {
            height: 12px;
        }

        .preview-frame::-webkit-scrollbar-track,
        .editor-preview-frame::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.28);
        }

        .preview-frame::-webkit-scrollbar-thumb,
        .editor-preview-frame::-webkit-scrollbar-thumb {
            background: rgba(29, 37, 84, 0.34);
            border-radius: 999px;
        }

        .poster-preview {
            width: var(--screen-preview-width, min(860px, calc(100vw - 72px)));
            height: var(--screen-preview-height, auto);
            flex: 0 0 auto;
            margin: 0 auto;
            aspect-ratio: var(--screen-aspect-ratio, 10 / 1);
            position: relative;
            border: 2px dashed rgba(29, 37, 84, 0.22);
            background: rgba(255, 255, 255, 0.28);
            font-size: clamp(22px, 4vw, 36px);
            font-weight: 700;
            letter-spacing: 0;
            overflow: hidden;
            transform: translate(var(--preview-pan-x, 0px), var(--preview-pan-y, 0px)) scale(var(--preview-zoom, 1));
            transform-origin: center center;
            touch-action: none;
        }

        .preview-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(29, 37, 84, 0.72);
            pointer-events: none;
        }

        .product-size-panel {
            width: min(860px, calc(100vw - 72px));
            margin: -2px auto 4px;
            display: grid;
            grid-template-columns: auto minmax(220px, 1fr) auto;
            align-items: center;
            gap: 12px;
            color: var(--ink);
            font-size: 15px;
            font-weight: 800;
        }

        .product-size-panel label {
            white-space: nowrap;
        }

        .product-select {
            min-width: 0;
            min-height: 42px;
            padding: 6px 12px;
            border: 2px solid rgba(29, 37, 84, 0.36);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.68);
            color: var(--ink);
            font: inherit;
            cursor: pointer;
        }

        .product-size-meta {
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
        }

        .poster-preview.has-text .preview-placeholder { display: none; }

        .preview-text-layer {
            position: absolute;
            z-index: 30;
            left: 5%;
            top: 18%;
            width: 28%;
            height: 52%;
            min-width: 24px;
            min-height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-size: 24px;
            font-weight: 800;
            line-height: 1.1;
            text-align: center;
            overflow: hidden;
            cursor: move;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(29, 37, 84, 0.34);
            outline: 2px solid rgba(37, 99, 235, 0);
            outline-offset: -2px;
            touch-action: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .preview-media-layer {
            z-index: 20;
            background: rgba(29, 37, 84, 0.1);
            border: 2px solid rgba(29, 37, 84, 0.34);
            color: rgba(29, 37, 84, 0.86);
            font-size: 20px;
            background-size: cover;
            background-position: center;
        }

        .preview-image-layer { z-index: 20; }
        .preview-video-layer { z-index: 10; }

        .preview-media-element {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
        }

        .preview-text-layer:hover,
        .preview-text-layer.active-preview-layer {
            outline-color: rgba(37, 99, 235, 0.75);
            background: rgba(255, 255, 255, 0.18);
        }

        .preview-text-layer.active-preview-layer {
            outline-width: 3px;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.82), 0 0 0 6px rgba(37, 99, 235, 0.22);
        }

        .poster-preview.has-active-layer {
            box-shadow: inset 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .preview-text-layer.active-preview-layer::after {
            content: "";
            position: absolute;
            inset: 3px;
            border: 3px dashed rgba(37, 99, 235, 0.95);
            border-radius: 6px;
            pointer-events: none;
            z-index: 29;
        }

        .preview-layer-resize {
            position: absolute;
            right: -6px;
            bottom: -6px;
            width: 22px;
            height: 22px;
            border-left: 3px solid rgba(37, 99, 235, 0.85);
            border-top: 3px solid rgba(37, 99, 235, 0.85);
            border-radius: 4px;
            cursor: nwse-resize;
            background: rgba(255, 255, 255, 0.8);
            touch-action: none;
        }

        .effect-typewriter { animation: typewriterPreview 1s steps(12, end); }
        .effect-fade-up { animation: fadeUpPreview 0.85s ease-out; }
        .effect-mask-reveal { animation: maskRevealPreview 0.85s ease-out; }
        .effect-light-sweep::before {
            content: "";
            position: absolute;
            inset: -20%;
            background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,0.9) 50%, transparent 65%);
            animation: lightSweepPreview 0.9s ease-out;
            pointer-events: none;
        }
        .effect-fade-out { animation: fadeOutPreview 0.9s ease-in; }
        .effect-slide-out { animation: slideOutPreview 0.85s ease-in; }
        .effect-glitch-out { animation: glitchOutPreview 0.75s steps(2, end); }
        .effect-particle { animation: particleDissolvePreview 0.9s ease-in; }
        .effect-stretch-out { animation: stretchOutPreview 0.8s ease-in; }

        @keyframes typewriterPreview {
            from { clip-path: inset(0 100% 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }

        @keyframes fadeUpPreview {
            from { opacity: 0; transform: translateY(24px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes maskRevealPreview {
            from { clip-path: inset(0 100% 0 0); opacity: 0.85; }
            to { clip-path: inset(0 0 0 0); opacity: 1; }
        }

        @keyframes lightSweepPreview {
            from { transform: translateX(-120%); }
            to { transform: translateX(120%); }
        }

        @keyframes fadeOutPreview {
            from { opacity: 1; }
            to { opacity: 0.08; filter: blur(5px); }
        }

        @keyframes slideOutPreview {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(160%); }
        }

        @keyframes glitchOutPreview {
            0% { opacity: 1; transform: translate(0, 0) skewX(0); filter: none; }
            25% { transform: translate(6px, -2px) skewX(8deg); filter: contrast(1.8); }
            50% { transform: translate(-5px, 3px) skewX(-10deg); opacity: 0.8; }
            75% { transform: translate(8px, 0) skewX(16deg); opacity: 0.45; }
            100% { transform: translate(-16px, 0) skewX(-20deg); opacity: 0; }
        }

        @keyframes particleDissolvePreview {
            from { opacity: 1; filter: blur(0); transform: scale(1); }
            to { opacity: 0; filter: blur(8px); transform: scale(1.08); }
        }

        @keyframes stretchOutPreview {
            from { opacity: 1; transform: scaleX(1); }
            to { opacity: 0; transform: scaleX(2.4); }
        }

        .arrange-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            min-height: 58px;
            flex-wrap: wrap;
        }

        .export-jobs-panel {
            display: none;
            align-items: center;
            min-height: 54px;
        }

        .export-jobs-panel.has-jobs {
            display: flex;
        }

        .export-job {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: wrap;
            min-height: 54px;
            padding: 8px 12px;
            border: 2px solid rgba(29, 37, 84, 0.26);
            background: rgba(255, 255, 255, 0.42);
            color: var(--ink);
            font-size: 14px;
            font-weight: 700;
        }

        .export-job-title {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .export-job-meta {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        .export-status {
            border: 1px solid rgba(29, 37, 84, 0.28);
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.64);
            white-space: nowrap;
        }

        .export-status.waiting_renderer { color: #8a5a00; }
        .export-status.processing,
        .export-status.queued { color: #1d4ed8; }
        .export-status.completed { color: #15803d; }
        .export-status.failed { color: var(--danger); }

        .export-link {
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            text-decoration: underline;
            white-space: nowrap;
        }

        .download-hint {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            max-width: 210px;
            line-height: 1.25;
        }

        .action-btn {
            min-width: 166px;
            min-height: 54px;
            padding: 10px 42px;
            border: 3px solid var(--line);
            border-radius: 6px;
            background: var(--panel-strong);
            color: var(--ink);
            font-size: clamp(26px, 3.4vw, 36px);
            font-weight: 800;
            letter-spacing: 0;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(29, 37, 84, 0.12);
            transition: transform 0.18s, background 0.18s, box-shadow 0.18s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            background: white;
            box-shadow: 0 14px 34px rgba(29, 37, 84, 0.18);
        }

        .action-btn:active { transform: translateY(0); }
        .action-btn:disabled { cursor: wait; opacity: 0.62; transform: none; }
        .preview-btn.is-playing {
            background: var(--ink);
            color: #fff;
            box-shadow: 0 14px 34px rgba(29, 37, 84, 0.24);
        }

        .poster-preview.preview-playback .preview-text-layer {
            pointer-events: none;
        }

        .playback-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        .ruler-row {
            display: grid;
            grid-template-columns: 100px minmax(0, 860px) 100px;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .timeline-ruler {
            position: relative;
            grid-column: 2;
            width: 100%;
            height: 54px;
            margin: 0;
        }

        .ruler-line {
            position: absolute;
            left: 0;
            right: 0;
            top: 36px;
            height: 3px;
            background: var(--line);
        }

        .tick {
            position: absolute;
            top: 0;
            width: 56px;
            margin-left: -28px;
            text-align: center;
            font-size: clamp(18px, 2.1vw, 26px);
            font-weight: 700;
        }

        .tick::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 32px;
            width: 4px;
            height: 12px;
            background: var(--line);
            border-radius: 999px;
            transform: translateX(-50%);
        }

        .tick:first-child { margin-left: 0; text-align: left; }
        .tick:first-child::after { left: 0; transform: none; }
        .tick:last-child { margin-left: -56px; text-align: right; }
        .tick:last-child::after { left: auto; right: 0; transform: none; }

        .timeline-playhead {
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 0;
            width: 4px;
            z-index: 4;
            border-radius: 999px;
            background: var(--danger);
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.16);
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%);
        }

        .timeline-playhead::before {
            content: "";
            position: absolute;
            left: 50%;
            top: -3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--danger);
            transform: translateX(-50%);
        }

        .timeline-ruler.is-playing .timeline-playhead {
            opacity: 1;
        }

        .material-board {
            display: grid;
            gap: 18px;
            padding-top: 0;
        }

        .material-row {
            display: grid;
            grid-template-columns: 100px minmax(0, 860px) 100px;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }

        .effect-select {
            width: 100%;
            min-height: 62px;
            border: 3px solid var(--line);
            border-radius: 6px;
            background: var(--panel);
            color: var(--ink);
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            text-align-last: center;
            cursor: pointer;
            outline: none;
            white-space: normal;
        }

        .clip-lane {
            width: 100%;
            height: 62px;
            position: relative;
        }

        .content-slot {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 62px;
            border: 3px solid var(--line);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 -8px 0 rgba(29, 37, 84, 0.04);
            cursor: grab;
            touch-action: none;
            transition: background 0.15s, box-shadow 0.15s;
        }

        .content-slot:hover,
        .content-slot.dragging {
            background: rgba(255, 255, 255, 0.42);
            box-shadow: inset 0 -8px 0 rgba(29, 37, 84, 0.04), 0 8px 22px rgba(29, 37, 84, 0.12);
        }

        .content-slot.dragging { cursor: grabbing; }

        .content-slot.selected-timeline-clip {
            background: rgba(255, 255, 255, 0.52);
            box-shadow: inset 0 -8px 0 rgba(29, 37, 84, 0.04), 0 0 0 4px rgba(37, 99, 235, 0.24), 0 10px 26px rgba(29, 37, 84, 0.14);
        }

        .resize-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 18px;
            z-index: 5;
            cursor: ew-resize;
            background: rgba(29, 37, 84, 0.08);
            touch-action: none;
        }

        .resize-handle::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 28px;
            border-left: 2px solid rgba(29, 37, 84, 0.42);
            border-right: 2px solid rgba(29, 37, 84, 0.42);
            transform: translate(-50%, -50%);
        }

        .resize-left { left: 0; border-right: 2px solid rgba(29, 37, 84, 0.24); }
        .resize-right { right: 0; border-left: 2px solid rgba(29, 37, 84, 0.24); }

        .content-input {
            width: 100%;
            height: 100%;
            min-height: 62px;
            padding: 0 188px 0 34px;
            border: 0;
            background: transparent;
            color: var(--ink);
            font: inherit;
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 800;
            text-align: center;
            outline: none;
        }

        .content-input::placeholder { color: rgba(29, 37, 84, 0.82); }

            .text-tools {
                position: absolute;
                right: 24px;
                top: 50%;
                z-index: 6;
                display: flex;
            align-items: center;
            gap: 6px;
            transform: translateY(-50%);
        }

        .text-tools input,
        .text-tools select {
            height: 30px;
            border: 2px solid rgba(29, 37, 84, 0.42);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--ink);
            font-weight: 800;
        }

        .text-color {
            width: 34px;
            padding: 2px;
            cursor: pointer;
        }

        .text-font {
            width: 76px;
            padding: 0 4px;
        }

        .text-weight { width: 56px; }

        .text-size {
            width: 86px;
            padding: 0;
            cursor: pointer;
            accent-color: var(--ink);
        }

        .upload-input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .upload-label {
            width: 100%;
            min-height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 34px;
            color: var(--ink);
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 800;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .upload-label.has-file {
            font-size: clamp(18px, 2vw, 24px);
            color: var(--ink-soft);
        }

        .image-editor-screen {
            display: none;
            min-height: 100vh;
            padding: 18px clamp(14px, 3vw, 40px) 30px;
        }

        body.image-editing .studio { display: none; }
        body.image-editing .image-editor-screen { display: block; }

        .editor-title {
            margin: 0 0 14px;
            text-align: center;
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 900;
        }

        .editor-preview-frame {
            position: sticky;
            top: 0;
            z-index: 30;
            width: 100%;
            min-height: min(56vh, 520px);
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 44px;
            overflow-x: auto;
            overflow-y: hidden;
            border: none;
            background: transparent;
            box-shadow: none;
        }

        .image-editor-screen .poster-preview {
            width: var(--editor-preview-width, min(1360px, calc(100vw - 72px)));
            height: var(--editor-preview-height, min(54vh, 500px));
            aspect-ratio: var(--screen-aspect-ratio, auto);
            border: none;
            background: transparent;
            overflow: visible;
        }

        .image-editor-screen .preview-placeholder {
            display: none;
        }

        .editor-safe-frame {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 20;
            width: 100%;
            height: 100%;
            aspect-ratio: var(--screen-aspect-ratio, 10 / 1);
            border: 3px dashed rgba(29, 37, 84, 0.26);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .editor-image-layer {
            position: absolute;
            left: 8%;
            top: 15%;
            width: 84%;
            height: 70%;
            min-width: 32px;
            min-height: 22px;
            border: 2px solid rgba(37, 99, 235, 0.85);
            cursor: move;
            touch-action: none;
        }

        .image-editor-screen.crop-mode .editor-image-layer {
            border-color: var(--danger);
            cursor: crosshair;
        }

        .editor-image-content {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
        }

        .editor-video-content {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            display: none;
        }

        .corner-handle {
            position: absolute;
            width: 14px;
            height: 14px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            background: #fff;
            transform: translate(-50%, -50%);
            z-index: 3;
            cursor: grab;
            touch-action: none;
        }

        .corner-tl { left: 0; top: 0; }
        .corner-tr { left: 100%; top: 0; }
        .corner-br { left: 100%; top: 100%; }
        .corner-bl { left: 0; top: 100%; }

        .editor-resize-handle,
        .editor-crop-handle {
            position: absolute;
            z-index: 2;
            background: rgba(37, 99, 235, 0.12);
        }

        .editor-resize-handle {
            border: 1px solid rgba(37, 99, 235, 0.4);
            touch-action: none;
        }

        .resize-e,
        .resize-w {
            top: 18px;
            bottom: 18px;
            width: 10px;
            cursor: ew-resize;
        }

        .resize-n,
        .resize-s {
            left: 18px;
            right: 18px;
            height: 10px;
            cursor: ns-resize;
        }

        .resize-e { right: -6px; }
        .resize-w { left: -6px; }
        .resize-n { top: -6px; }
        .resize-s { bottom: -6px; }

        .resize-se {
            right: -8px;
            bottom: -8px;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            cursor: nwse-resize;
        }

        .editor-crop-handle {
            background: rgba(220, 38, 38, 0.18);
            display: none;
        }

        .image-editor-screen.crop-mode .editor-crop-handle {
            display: block;
        }

        .crop-left,
        .crop-right {
            top: 22%;
            bottom: 22%;
            width: 12px;
            cursor: ew-resize;
        }

        .crop-top,
        .crop-bottom {
            left: 22%;
            right: 22%;
            height: 12px;
            cursor: ns-resize;
        }

        .crop-left { left: 0; }
        .crop-right { right: 0; }
        .crop-top { top: 0; }
        .crop-bottom { bottom: 0; }

        .editor-crop-selection {
            position: absolute;
            z-index: 4;
            display: none;
            border: 3px dashed var(--danger);
            background: rgba(220, 38, 38, 0.12);
            pointer-events: none;
        }

        .editor-crop-selection.is-drawing {
            display: block;
            pointer-events: auto;
        }

        .crop-selection-edge {
            position: absolute;
            z-index: 5;
            background: rgba(220, 38, 38, 0.72);
        }

        .crop-selection-edge-left,
        .crop-selection-edge-right {
            top: -10px;
            bottom: -10px;
            width: 12px;
            cursor: ew-resize;
        }

        .crop-selection-edge-top,
        .crop-selection-edge-bottom {
            left: -10px;
            right: -10px;
            height: 12px;
            cursor: ns-resize;
        }

        .crop-selection-edge-left { left: -7px; }
        .crop-selection-edge-right { right: -7px; }
        .crop-selection-edge-top { top: -7px; }
        .crop-selection-edge-bottom { bottom: -7px; }

        .image-editor-tools {
            width: min(960px, 100%);
            margin: 0 auto;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .tool-panel {
            display: none;
            border: 3px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.34);
            padding: 14px;
        }

        .tool-panel h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .tool-row {
            display: grid;
            grid-template-columns: 88px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            min-height: 34px;
            font-weight: 800;
        }

        .tool-row input[type="range"] {
            width: 100%;
            accent-color: var(--ink);
        }

        .editor-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            padding-top: 6px;
            flex-wrap: wrap;
        }

        .editor-action-btn {
            min-width: 150px;
            min-height: 48px;
            border: 3px solid var(--line);
            border-radius: 8px;
            background: var(--panel-strong);
            color: var(--ink);
            font-size: 22px;
            font-weight: 900;
            cursor: pointer;
        }

        .editor-action-btn.primary {
            background: var(--ink);
            color: #fff;
        }

        .editor-action-btn.primary.is-processing,
        .editor-action-btn.primary:disabled {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            cursor: wait;
            opacity: 1;
        }

        .editor-action-btn.is-active {
            background: var(--danger);
            color: #fff;
        }

        @media (max-width: 760px) {
            .studio {
                width: min(100vw - 20px, 1180px);
                padding: 26px 0 34px;
                gap: 18px;
            }

            .preview-frame {
                min-height: 118px;
                border-width: 2px;
                padding: 0 14px;
            }

            .poster-preview {
                width: min(860px, calc(100vw - 42px));
            }

            .image-editor-screen {
                padding: 18px 0 30px;
            }

            .editor-preview-frame {

                padding: 0 14px;

            }

            .ruler-line { top: 38px; height: 2px; }

            .timeline-playhead { width: 3px; }
            .timeline-playhead::before { width: 11px; height: 11px; }

            .material-board {
                gap: 18px;
            }

            .material-row {
                grid-template-columns: 68px minmax(0, 1fr) 68px;
                gap: 10px;
            }

            .ruler-row {
                grid-template-columns: 68px minmax(0, 1fr) 68px;
                gap: 10px;
            }

            .effect-select {
                min-height: 58px;
                border-width: 2px;
                font-size: 13px;
                padding: 0 2px;
            }

            .clip-lane,
            .content-slot,
            .content-input,
            .upload-label {
                height: 58px;
                min-height: 58px;
                border-width: 2px;
            }

            .content-input,
            .upload-label {
                padding: 0 24px;
            }

            .content-input {
                padding-right: 118px;
                font-size: 24px;
            }

            .text-tools {
                right: 18px;
                gap: 3px;
            }

            .text-tools input,
            .text-tools select {
                height: 24px;
                font-size: 10px;
                border-width: 1px;
            }

            .text-color { width: 26px; }
            .text-font { width: 48px; }
            .text-weight { width: 38px; }
            .text-size { width: 46px; }

            .resize-handle {
                width: 34px;

            }

            .resize-handle::after {
                width: 5px;
                height: 36px;
                border-left-width: 3px;
                border-right-width: 3px;
            }

            .preview-layer-resize {
                right: -13px;
                bottom: -13px;
                width: 36px;
                height: 36px;
                border-left-width: 4px;
                border-top-width: 4px;
            }

            .corner-handle {
                width: 30px;
                height: 30px;
                border-width: 3px;
            }

            .editor-resize-handle.resize-e {

            }

            .editor-resize-handle.resize-s {
                bottom: -14px;

            }

            .editor-resize-handle.resize-se {

            }

            .action-btn {
                min-width: 132px;
                min-height: 54px;
                border-width: 2px;
                padding: 10px 26px;
            }

            .arrange-row {
                gap: 10px;
            }

            .product-size-panel {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .image-editor-tools {
                grid-template-columns: 1fr;
            }

            .editor-actions {

    </style>
</head>
<body>
    <main class="studio">
        <h1 class="title">Ai Poster</h1>

        <section class="preview-frame" aria-label="廣告機預覽">

        <section class="ruler-row" aria-label="30 秒時間軸">

                <div class="tick" style="left: 66.66%;">20s</div>

                    <option value="effect-light-sweep">CC Light Sweep</option>

                    <option value="add-video">在下方增加上傳視頻框</option>

                <div class="clip-lane">

                                <option value='"Microsoft JhengHei", "Noto Sans TC", sans-serif'>微軟正黑</option>
                                <option value='"Bradley Hand", "Comic Sans MS", cursive'>手寫</option>
                                <option value='Impact, Haettenschweiler, sans-serif'>Impact</option>
                            </select>
                            <select class="text-weight" title="文字粗細">
                                <option value="400">細</option>
                                <option value="700">粗</option>
                                <option value="900" selected>黑</option>
                            </select>
                            <input class="text-size" type="range" value="24" min="8" max="86" step="1" title="字型大小">
                        </div>
                        <span class="resize-handle resize-right" aria-hidden="true"></span>
                    </div>
                </div>
                <select class="effect-select" aria-label="文字出場特效" onchange="handleEffectSelect(this)">
                    <option>出場特效</option>
                    <option value="effect-fade-out">Fade Out / Dissolve</option>
                    <option value="effect-slide-out">Fly Off / Slide Out</option>
                    <option value="effect-glitch-out">Glitch Out</option>
                    <option value="effect-particle">Particle Dissolve</option>
                    <option value="effect-stretch-out">Stretch Out</option>
                    <option value="delete-row">刪除本框</option>
                </select>
            </div>

            <div class="material-row">
                <select class="effect-select" aria-label="圖片入場特效" onchange="handleEffectSelect(this)">
                    <option>入場特效</option>
                    <option value="effect-typewriter">Typewriter</option>
                    <option value="effect-fade-up">Fade Up Characters</option>
                    <option value="effect-mask-reveal">Mask Reveal</option>
                    <option value="effect-light-sweep">CC Light Sweep</option>
                    <option value="add-text">在下方增加輸入文字框</option>
                    <option value="add-image">在下方增加上傳圖片框</option>
                    <option value="add-video">在下方增加上傳視頻框</option>

                    </div>
                </div>
                <select class="effect-select" aria-label="圖片出場特效" onchange="handleEffectSelect(this)">
                    <option>出場特效</option>
                    <option value="effect-fade-out">Fade Out / Dissolve</option>
                    <option value="effect-slide-out">Fly Off / Slide Out</option>
                    <option value="effect-glitch-out">Glitch Out</option>
                    <option value="effect-particle">Particle Dissolve</option>
                    <option value="effect-stretch-out">Stretch Out</option>
                    <option value="delete-row">刪除本框</option>
                </select>
            </div>

            <div class="material-row">
                <select class="effect-select" aria-label="視頻入場特效" onchange="handleEffectSelect(this)">
                    <option>入場特效</option>
                    <option value="effect-typewriter">Typewriter</option>
                    <option value="effect-fade-up">Fade Up Characters</option>
                    <option value="effect-mask-reveal">Mask Reveal</option>
                    <option value="effect-light-sweep">CC Light Sweep</option>

            return product.width / Math.max(1, product.height);

        function fitScreenSize(maxWidth, maxHeight, product = selectedProduct()) {
            const ratio = screenRatio(product);
            if (ratio >= maxWidth / maxHeight) {
                return {
                    width: Math.max(1, Math.round(maxWidth)),
                    height: Math.max(1, Math.round(maxWidth / ratio))
                };
            }

            return {
                width: Math.max(1, Math.round(maxHeight * ratio)),
                height: Math.max(1, Math.round(maxHeight))
            };
        }

        function readablePreviewSize(maxWidth, maxHeight, product = selectedProduct(), options = {}) {
            const ratio = screenRatio(product);
            const size = fitScreenSize(maxWidth, maxHeight, product);
            const minWideHeight = options.minWideHeight || 44;
            const maxScrollableWidth = options.maxScrollableWidth || maxWidth;

            if (ratio >= 24 && size.height < minWideHeight) {
                return {
                    width: Math.min(Math.round(minWideHeight * ratio), Math.round(maxScrollableWidth)),
                    height: minWideHeight
                };
            }

            return size;
        }

            const ratio = screenRatio(product);
            if (ratio >= 1) {
                return {
                    width: evenExportDimension(EXPORT_MAX_LONG_SIDE),
                    height: evenExportDimension(EXPORT_MAX_LONG_SIDE / ratio)
                };
            }

            return {
                width: evenExportDimension(EXPORT_MAX_LONG_SIDE * ratio),
                height: evenExportDimension(EXPORT_MAX_LONG_SIDE)
            };

        const viewportGestureStates = new WeakMap();

        function applyViewportTransform(target, state) {
            target.style.setProperty('--preview-zoom', state.scale.toFixed(3));
            target.style.setProperty('--preview-pan-x', `${state.x.toFixed(1)}px`);
            target.style.setProperty('--preview-pan-y', `${state.y.toFixed(1)}px`);
        }

        function resetViewportZoom(target) {
            const state = viewportGestureStates.get(target);
            if (!state) return;
            state.scale = 1;
            state.x = 0;
            state.y = 0;
            state.pointers.clear();
            state.gesture = null;
            applyViewportTransform(target, state);
        }

        function setupViewportGestures(target) {
            if (!target || viewportGestureStates.has(target)) return;
            const state = {
                scale: 1,
                x: 0,
                y: 0,
                pointers: new Map(),
                gesture: null
            };
            viewportGestureStates.set(target, state);
            applyViewportTransform(target, state);

            const pointDistance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
            const pointCenter = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
            const editableLayerSelector = '.preview-text-layer, .editor-image-layer, .editor-crop-selection, .editor-crop-handle, .corner-handle, .resize-handle';

            target.addEventListener('pointerdown', (event) => {
                state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
                if (state.pointers.size === 2) {
                    const [first, second] = Array.from(state.pointers.values());
                    target.dataset.viewportGesture = 'pinch';
                    state.gesture = {
                        mode: 'pinch',
                        distance: pointDistance(first, second),
                        center: pointCenter(first, second),
                        scale: state.scale,
                        x: state.x,
                        y: state.y
                    };
                    event.preventDefault();
                    return;
                }

                if (state.pointers.size === 1 && state.scale > 1 && !event.target.closest(editableLayerSelector)) {
                    target.dataset.viewportGesture = 'pan';
                    state.gesture = {
                        mode: 'pan',
                        pointerId: event.pointerId,
                        x: state.x,
                        y: state.y,
                        pointerX: event.clientX,
                        pointerY: event.clientY
                    };
                    event.preventDefault();
                }
            }, { capture: true });

            target.addEventListener('pointermove', (event) => {
                if (!state.pointers.has(event.pointerId)) return;
                state.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

                if (state.gesture?.mode === 'pinch' && state.pointers.size >= 2) {
                    const [first, second] = Array.from(state.pointers.values());
                    const center = pointCenter(first, second);
                    const nextScale = clamp(state.gesture.scale * (pointDistance(first, second) / Math.max(1, state.gesture.distance)), 1, 5);
                    state.scale = nextScale;
                    state.x = state.gesture.x + (center.x - state.gesture.center.x);
                    state.y = state.gesture.y + (center.y - state.gesture.center.y);
                    applyViewportTransform(target, state);
                    event.preventDefault();
                } else if (state.gesture?.mode === 'pan' && state.gesture.pointerId === event.pointerId) {
                    state.x = state.gesture.x + event.clientX - state.gesture.pointerX;
                    state.y = state.gesture.y + event.clientY - state.gesture.pointerY;
                    applyViewportTransform(target, state);
                    event.preventDefault();
                }
            }, { capture: true });

            const endPointer = (event) => {
                state.pointers.delete(event.pointerId);
                if (state.pointers.size < 2 && state.gesture?.mode === 'pinch') {
                    state.gesture = null;
                    target.dataset.viewportGesture = '';
                }
                if (state.gesture?.pointerId === event.pointerId) {
                    state.gesture = null;
                    target.dataset.viewportGesture = '';
                }
            };

            target.addEventListener('pointerup', endPointer, { capture: true });
            target.addEventListener('pointercancel', endPointer, { capture: true });
            target.addEventListener('dblclick', () => {
                if (state.scale > 1) {
                    resetViewportZoom(target);
                } else {
                    state.scale = 2;
                    state.x = 0;
                    state.y = 0;
                    applyViewportTransform(target, state);
                }
            });
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function parseApiJson(response) {
            const text = await response.text();
            try {
                return JSON.parse(text);
            } catch (error) {
                throw new Error(text.slice(0, 120) || '伺服器回應格式不正確');
            }
        }

        async function uploadAssetToCloud(fileOrBlob, filename, clip) {
            if (!fileOrBlob) return null;

            const form = new FormData();
            form.append('file', fileOrBlob, filename || fileOrBlob.name || 'asset');

            const response = await fetch('/api/assets', {
                method: 'POST',
                body: form
            });
            const data = await parseApiJson(response);
            if (!response.ok || !data.ok) {
                throw new Error(data.message || data.code || '雲端素材上傳失敗');
            }

            if (clip && data.asset) {
                clip.dataset.assetId = data.asset.id;
                clip.dataset.assetUrl = data.asset.downloadUrl;
            }

            return data.asset;
        }

        async function backupClipAssetToCloud(clip, input) {
            const file = input?.files && input.files[0];
            const label = clip?.querySelector('.upload-label');
            if (!clip || !file) return null;

            const originalLabel = label?.textContent || file.name;
            if (label) label.textContent = `${file.name}｜上傳中`;

            try {
                const asset = await uploadAssetToCloud(file, file.name, clip);
                if (label) {
                    label.textContent = `${file.name}｜已備份`;
                    label.classList.add('has-file');
                }
                return asset;
            } catch (error) {
                if (label) label.textContent = `${originalLabel}｜雲端未備份`;
                console.warn('Cloud asset upload failed:', error);
                return null;
            }
        }

        function imageEditStateFromControls() {
            const numberValue = (id) => Number(document.getElementById(id)?.value || 0);
            return {
                crop: {

                },
                box: {

                    width: numberValue('imageWidth'),
                    height: numberValue('imageHeight')
                },
                corners: {
                    tl: { x: numberValue('cornerTlX'), y: numberValue('cornerTlY') },
                    tr: { x: numberValue('cornerTrX'), y: numberValue('cornerTrY') },
                    br: { x: numberValue('cornerBrX'), y: numberValue('cornerBrY') },
                    bl: { x: numberValue('cornerBlX'), y: numberValue('cornerBlY') }
                }
            };
        }

        function clipPathFromState(state) {
            const c = state.corners;
            return `polygon(${c.tl.x}% ${c.tl.y}%, ${c.tr.x}% ${c.tr.y}%, ${c.br.x}% ${c.br.y}%, ${c.bl.x}% ${c.bl.y}%)`;
        }

        function mediaClipPathFromState(state) {
            const crop = state.crop;
            const c = state.corners;
            const visibleWidth = Math.max(10, 100 - crop.left - crop.right);
            const visibleHeight = Math.max(10, 100 - crop.top - crop.bottom);
            const point = (corner) => ({
                x: crop.left + (corner.x / 100) * visibleWidth,
                y: crop.top + (corner.y / 100) * visibleHeight
            });
            const tl = point(c.tl);
            const tr = point(c.tr);
            const br = point(c.br);
            const bl = point(c.bl);
            return `polygon(${tl.x}% ${tl.y}%, ${tr.x}% ${tr.y}%, ${br.x}% ${br.y}%, ${bl.x}% ${bl.y}%)`;
        }

        function backgroundFromCrop(state) {
            const crop = state.crop;
            const visibleWidth = Math.max(10, 100 - crop.left - crop.right);
            const visibleHeight = Math.max(10, 100 - crop.top - crop.bottom);
            return {
                size: `${10000 / visibleWidth}% ${10000 / visibleHeight}%`,
                position: `${crop.left}% ${crop.top}%`
            };
        }

        function applyCropToMediaElement(media, state) {
            if (!media || !state) return;
            const crop = state.crop;
            const visibleWidth = Math.max(10, 100 - crop.left - crop.right);
            const visibleHeight = Math.max(10, 100 - crop.top - crop.bottom);
            media.style.left = `${-(crop.left / visibleWidth) * 100}%`;
            media.style.top = `${-(crop.top / visibleHeight) * 100}%`;
            media.style.width = `${10000 / visibleWidth}%`;
            media.style.height = `${10000 / visibleHeight}%`;
            media.style.clipPath = mediaClipPathFromState(state);
        }

        function applyImageStateToLayer(layer, state, imageUrl) {
            if (!layer || !state) return;
            const bg = backgroundFromCrop(state);
            layer.style.left = `${state.box.left}%`;
            layer.style.top = `${state.box.top}%`;
            layer.style.width = `${state.box.width}%`;
            layer.style.height = `${state.box.height}%`;
            const visualTarget = layer.querySelector('.editor-image-content') || layer;
            visualTarget.style.backgroundImage = imageUrl ? `url("${imageUrl}")` : visualTarget.style.backgroundImage;
            visualTarget.style.backgroundSize = bg.size;
            visualTarget.style.backgroundPosition = bg.position;
            visualTarget.style.backgroundRepeat = 'no-repeat';
            visualTarget.style.clipPath = clipPathFromState(state);
            visualTarget.style.display = 'block';
            const videoTarget = layer.querySelector('.editor-video-content');
            if (videoTarget) {
                videoTarget.pause?.();
                videoTarget.style.display = 'none';
                videoTarget.removeAttribute('src');
            }
        }

        function ensureVideoElement(layer) {
            let video = layer?.querySelector('.preview-media-element');
            if (!video && layer) {
                video = document.createElement('video');
                video.className = 'preview-media-element';
                video.muted = true;
                video.loop = true;
                video.playsInline = true;
                layer.insertBefore(video, layer.firstChild);
            }
            return video;
        }

        function applyVideoStateToLayer(layer, state, videoUrl) {
            if (!layer || !state) return;
            layer.style.left = `${state.box.left}%`;
            layer.style.top = `${state.box.top}%`;
            layer.style.width = `${state.box.width}%`;
            layer.style.height = `${state.box.height}%`;
            layer.style.backgroundImage = '';
            const video = layer.id === 'editorImageLayer' ? document.getElementById('editorVideoContent') : ensureVideoElement(layer);
            if (!video) return;
            if (videoUrl && video.src !== videoUrl) video.src = videoUrl;
            video.style.display = 'block';
            applyCropToMediaElement(video, state);
            const imageContent = layer.querySelector('.editor-image-content');
            if (imageContent) imageContent.style.display = 'none';
            video.play?.().catch(() => {});
        }

        function syncEditorControlsFromState(state) {
            const setValue = (id, value) => {
                const input = document.getElementById(id);
                if (input) input.value = value;
            };
            setValue('cropLeft', state.crop.left);
            setValue('cropTop', state.crop.top);
            setValue('cropRight', state.crop.right);
            setValue('cropBottom', state.crop.bottom);
            setValue('imageWidth', state.box.width);
            setValue('imageHeight', state.box.height);
            setValue('imagePosX', state.box.left);
            setValue('imagePosY', state.box.top);
            setValue('cornerTlX', state.corners.tl.x);
            setValue('cornerTlY', state.corners.tl.y);
            setValue('cornerTrX', state.corners.tr.x);
            setValue('cornerTrY', state.corners.tr.y);
            setValue('cornerBrX', state.corners.br.x);
            setValue('cornerBrY', state.corners.br.y);
            setValue('cornerBlX', state.corners.bl.x);
            setValue('cornerBlY', state.corners.bl.y);
        }

        function renderImageEditor() {
            if (!activeImageEdit) return;
            activeImageEdit.state = imageEditStateFromControls();
            const layer = document.getElementById('editorImageLayer');
            if (activeImageEdit.mediaType === 'video') {
                applyVideoStateToLayer(layer, activeImageEdit.state, activeImageEdit.videoUrl);
            } else {
                applyImageStateToLayer(layer, activeImageEdit.state, activeImageEdit.imageUrl);
            }
            updateEditorCornerHandles(layer, activeImageEdit.state);
        }

        function updateEditorCornerHandles(layer, state) {
            if (!layer || !state) return;
            Object.entries(state.corners).forEach(([corner, point]) => {
                const handle = layer.querySelector(`[data-corner="${corner}"]`);
                if (!handle) return;
                handle.style.left = `${point.x}%`;
                handle.style.top = `${point.y}%`;
            });
        }

        function renderCropSelection(selection) {
            const cropBox = document.getElementById('editorCropSelection');
            if (!cropBox) return;

            if (!selection) {
                cropBox.classList.remove('is-drawing');
                cropBox.style.left = '';
                cropBox.style.top = '';
                cropBox.style.width = '';
                cropBox.style.height = '';
                return;
            }

            cropBox.style.left = `${selection.left}%`;
            cropBox.style.top = `${selection.top}%`;
            cropBox.style.width = `${selection.width}%`;
            cropBox.style.height = `${selection.height}%`;
            cropBox.classList.add('is-drawing');
        }

        function cropStateFromSelection(baseState, selection) {
            const visibleWidth = Math.max(1, 100 - baseState.crop.left - baseState.crop.right);
            const visibleHeight = Math.max(1, 100 - baseState.crop.top - baseState.crop.bottom);
            const selectionRight = selection.left + selection.width;
            const selectionBottom = selection.top + selection.height;
            const left = clamp(baseState.crop.left + (selection.left / 100) * visibleWidth, 0, 90);
            const top = clamp(baseState.crop.top + (selection.top / 100) * visibleHeight, 0, 90);
            const right = clamp(baseState.crop.right + ((100 - selectionRight) / 100) * visibleWidth, 0, 90 - left);
            const bottom = clamp(baseState.crop.bottom + ((100 - selectionBottom) / 100) * visibleHeight, 0, 90 - top);
            const box = {
                left: clamp(baseState.box.left + (selection.left / 100) * baseState.box.width, 0, 100),
                top: clamp(baseState.box.top + (selection.top / 100) * baseState.box.height, 0, 100),
                width: clamp((selection.width / 100) * baseState.box.width, 8, 100),
                height: clamp((selection.height / 100) * baseState.box.height, 8, 100)
            };

            return {
                ...baseState,
                crop: { left, top, right, bottom },
                box
            };
        }

        function adjustedCropSelection(selection, edge, dxPercent, dyPercent) {
            const minSize = 3;
            const right = selection.left + selection.width;
            const bottom = selection.top + selection.height;
            const next = { ...selection };

            if (edge === 'left') {
                const left = clamp(selection.left + dxPercent, 0, right - minSize);
                next.left = left;
                next.width = right - left;
            }

            if (edge === 'right') {
                const nextRight = clamp(right + dxPercent, selection.left + minSize, 100);
                next.width = nextRight - selection.left;
            }

            if (edge === 'top') {
                const top = clamp(selection.top + dyPercent, 0, bottom - minSize);
                next.top = top;
                next.height = bottom - top;
            }

            if (edge === 'bottom') {
                const nextBottom = clamp(bottom + dyPercent, selection.top + minSize, 100);
                next.height = nextBottom - selection.top;
            }

            return next;
        }

        function defaultCropSelection() {
            return {
                left: 12,
                top: 12,
                width: 76,
                height: 76
            };
        }

        function imageElementFromUrl(imageUrl) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = reject;
                image.src = imageUrl;
            });
        }

        async function croppedImageUrlFromState(imageUrl, crop) {
            const image = await imageElementFromUrl(imageUrl);
            const sourceWidth = image.naturalWidth || image.width || 1;
            const sourceHeight = image.naturalHeight || image.height || 1;
            const sx = clamp((crop.left / 100) * sourceWidth, 0, sourceWidth - 1);
            const sy = clamp((crop.top / 100) * sourceHeight, 0, sourceHeight - 1);
            const sw = Math.max(1, ((100 - crop.left - crop.right) / 100) * sourceWidth);
            const sh = Math.max(1, ((100 - crop.top - crop.bottom) / 100) * sourceHeight);
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(sw));
            canvas.height = Math.max(1, Math.round(sh));
            const context = canvas.getContext('2d');
            context.drawImage(image, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/png');
        }

        function resetCutButton() {
            const screen = document.getElementById('imageEditorScreen');
            const btn = document.getElementById('cutModeBtn');
            screen?.classList.remove('crop-mode');
            btn?.classList.remove('is-active');
            if (btn) btn.textContent = '切割';
            renderCropSelection(null);
        }

        function enterCutMode() {
            const screen = document.getElementById('imageEditorScreen');
            const btn = document.getElementById('cutModeBtn');
            if (activeImageEdit && !activeImageEdit.pendingCropSelection) {
                activeImageEdit.pendingCropBaseState = imageEditStateFromControls();
                activeImageEdit.pendingCropSelection = defaultCropSelection();
                renderCropSelection(activeImageEdit.pendingCropSelection);
            }
            screen?.classList.add('crop-mode');
            btn?.classList.add('is-active');
            if (btn) btn.textContent = '進行切割';
        }

        async function applyPendingCutSelection() {
            if (!activeImageEdit?.pendingCropSelection) return false;
            const baseState = activeImageEdit.pendingCropBaseState || imageEditStateFromControls();
            const croppedState = cropStateFromSelection(baseState, activeImageEdit.pendingCropSelection);

            if (activeImageEdit.mediaType === 'video') {
                activeImageEdit.state = croppedState;
                activeImageEdit.pendingCropSelection = null;
                activeImageEdit.pendingCropBaseState = null;
                syncEditorControlsFromState(croppedState);
                renderImageEditor();
                syncActiveVideoEditToPreview(croppedState);
                resetCutButton();
                return true;
            }

            let imageUrl = activeImageEdit.imageUrl;

            try {
                imageUrl = await croppedImageUrlFromState(activeImageEdit.imageUrl, croppedState.crop);
            } catch (error) {
                imageUrl = activeImageEdit.imageUrl;
            }

            const next = {
                ...croppedState,
                crop: { left: 0, top: 0, right: 0, bottom: 0 }
            };
            activeImageEdit.state = next;
            activeImageEdit.imageUrl = imageUrl;
            activeImageEdit.imageSize = await loadImageSize(imageUrl);
            activeImageEdit.pendingCropSelection = null;
            activeImageEdit.pendingCropBaseState = null;
            syncEditorControlsFromState(next);
            renderImageEditor();
            resetCutButton();
            return true;
        }

        async function openImageEditor(input, file) {
            const clip = input.closest('.timeline-clip');
            const imageUrl = await readFileAsDataUrl(file);
            const imageSize = await loadImageSize(imageUrl);
            const savedState = clip?._editorImageState || clip?._imageEditState || {
                crop: { left: 0, top: 0, right: 0, bottom: 0 },
                box: fitImageBoxToEditor(imageSize),
                corners: {
                    tl: { x: 0, y: 0 },
                    tr: { x: 100, y: 0 },
                    br: { x: 100, y: 100 },
                    bl: { x: 0, y: 100 }
                }
            };

            activeImageEdit = {
                mediaType: 'image',
                input,
                clip,
                imageUrl,
                imageSize,
                state: savedState,
                pendingCropSelection: null,
                pendingCropBaseState: null
            };
            syncEditorControlsFromState(savedState);
            document.getElementById('mediaEditorTitle').textContent = '圖片編輯';
            document.body.classList.add('image-editing');
            resetViewportZoom(document.getElementById('imageEditorPreview'));
            resetCutButton();
            resetFinishEditButton();
            renderImageEditor();
        }

        async function openVideoEditor(input, file) {
            const clip = input.closest('.timeline-clip');
            const videoUrl = URL.createObjectURL(file);
            const videoSize = await loadVideoSize(videoUrl);
            const savedState = clip?._editorVideoState || {
                crop: { left: 0, top: 0, right: 0, bottom: 0 },
                box: fitImageBoxToEditor(videoSize),
                corners: {
                    tl: { x: 0, y: 0 },
                    tr: { x: 100, y: 0 },
                    br: { x: 100, y: 100 },
                    bl: { x: 0, y: 100 }
                }
            };

            activeImageEdit = {
                mediaType: 'video',
                input,
                clip,
                videoUrl,
                videoSize,
                state: savedState,
                pendingCropSelection: null,
                pendingCropBaseState: null
            };
            syncEditorControlsFromState(savedState);
            document.getElementById('mediaEditorTitle').textContent = '視頻編輯';
            document.body.classList.add('image-editing');
            resetViewportZoom(document.getElementById('imageEditorPreview'));
            resetCutButton();
            resetFinishEditButton();
            renderImageEditor();
        }

        function loadImageSize(imageUrl) {
            return new Promise((resolve) => {
                const image = new Image();
                image.onload = () => resolve({ width: image.naturalWidth || 1, height: image.naturalHeight || 1 });
                image.onerror = () => resolve({ width: 10, height: 1 });
                image.src = imageUrl;
            });
        }

        function loadVideoSize(videoUrl) {
            return new Promise((resolve) => {
                const video = document.createElement('video');
                video.onloadedmetadata = () => resolve({ width: video.videoWidth || 10, height: video.videoHeight || 1 });
                video.onerror = () => resolve({ width: 10, height: 1 });
                video.src = videoUrl;
            });
        }

        function fitImageBoxToEditor(imageSize) {
            const preview = document.getElementById('imageEditorPreview');
            const rect = preview?.getBoundingClientRect();
            const previewRatio = rect && rect.height ? rect.width / rect.height : 10;
            const imageRatio = imageSize.width / Math.max(1, imageSize.height);
            const maxWidth = 92;
            const maxHeight = 86;
            let width = maxWidth;
            let height = (width * previewRatio) / imageRatio;

            if (height > maxHeight) {
                height = maxHeight;
                width = (height * imageRatio) / previewRatio;
            }

            return {
                left: (100 - width) / 2,
                top: (100 - height) / 2,
                width,
                height
            };
        }

        function imageStateForPosterPreview(imageSize) {
            const previewRatio = 10;
            const imageRatio = imageSize.width / Math.max(1, imageSize.height);
            const maxWidth = 92;
            const maxHeight = 82;
            let width = maxWidth;
            let height = (width * previewRatio) / imageRatio;

            if (height > maxHeight) {
                height = maxHeight;
                width = (height * imageRatio) / previewRatio;
            }

            return {
                crop: { left: 0, top: 0, right: 0, bottom: 0 },
                box: {
                    left: (100 - width) / 2,
                    top: (100 - height) / 2,
                    width,
                    height
                },
                corners: {
                    tl: { x: 0, y: 0 },
                    tr: { x: 100, y: 0 },
                    br: { x: 100, y: 100 },
                    bl: { x: 0, y: 100 }
                }
            };
        }

        function imageStateForPosterPreviewFromEditor(fallbackImageSize, sourceState) {
            const safeFrame = document.querySelector('.editor-safe-frame');
            const layer = document.getElementById('editorImageLayer');
            const safeRect = safeFrame?.getBoundingClientRect();
            const layerRect = layer?.getBoundingClientRect();

            if (!safeRect || !layerRect || !safeRect.width || !safeRect.height) {
                return imageStateForPosterPreview(fallbackImageSize);
            }

            return {
                crop: sourceState?.crop || { left: 0, top: 0, right: 0, bottom: 0 },
                box: {
                    left: ((layerRect.left - safeRect.left) / safeRect.width) * 100,
                    top: ((layerRect.top - safeRect.top) / safeRect.height) * 100,
                    width: (layerRect.width / safeRect.width) * 100,
                    height: (layerRect.height / safeRect.height) * 100
                },
                corners: sourceState?.corners || {
                    tl: { x: 0, y: 0 },
                    tr: { x: 100, y: 0 },
                    br: { x: 100, y: 100 },
                    bl: { x: 0, y: 100 }
                }
            };
        }

        function visibleMediaAspectRatio(mediaSize, crop) {
            const visibleWidth = Math.max(1, mediaSize.width * (100 - crop.left - crop.right) / 100);
            const visibleHeight = Math.max(1, mediaSize.height * (100 - crop.top - crop.bottom) / 100);
            return visibleWidth / visibleHeight;
        }

        function syncActiveVideoEditToPreview(state = imageEditStateFromControls()) {
            if (!activeImageEdit || activeImageEdit.mediaType !== 'video') return;
            const { clip, videoUrl, videoSize } = activeImageEdit;
            if (!clip || !videoUrl || !videoSize) return;

            clip._editorVideoState = state;
            clip._posterVideoState = imageStateForPosterPreviewFromEditor(videoSize, state);
            clip._videoUrl = videoUrl;
            clip._videoAspectRatio = visibleMediaAspectRatio(videoSize, state.crop);

            const layer = getMediaLayer(clip, true);
            applyVideoStateToLayer(layer, clip._posterVideoState, videoUrl);
            if (layer) {
                layer.firstChild.nodeValue = '';
                layer.dataset.fixedRatio = 'true';
                layer.dataset.aspectRatio = String(clip._videoAspectRatio);
            }
            updatePreviewPlaceholder();
        }

        async function toggleCutMode() {
            if (!activeImageEdit) return;
            if (await applyPendingCutSelection()) return;

            const screen = document.getElementById('imageEditorScreen');
            if (screen?.classList.contains('crop-mode')) {
                activeImageEdit.pendingCropSelection = null;
                activeImageEdit.pendingCropBaseState = null;
                resetCutButton();
                return;
            }

            enterCutMode();
        }

        function cancelImageEdit() {
            activeImageEdit = null;
            document.body.classList.remove('image-editing');
            resetCutButton();
            resetFinishEditButton();
        }

        function setFinishEditButtonProcessing() {
            const btn = document.getElementById('finishImageEditBtn');
            if (!btn) return false;
            if (btn.disabled) return false;
            btn.disabled = true;
            btn.classList.add('is-processing');
            btn.textContent = '請稍後';
            return true;
        }

        function resetFinishEditButton() {
            const btn = document.getElementById('finishImageEditBtn');
            if (!btn) return;
            btn.disabled = false;
            btn.classList.remove('is-processing');
            btn.textContent = '編輯完成';
        }

        async function finishImageEdit() {
            if (!activeImageEdit) return;
            if (!setFinishEditButtonProcessing()) return;

            try {
                await applyPendingCutSelection();
                if (activeImageEdit.mediaType === 'video') {
                    await finishVideoEdit();
                    return;
                }
                const { clip, input, imageUrl, imageSize } = activeImageEdit;
                const state = imageEditStateFromControls();
                clip._editorImageState = state;
                clip._posterImageState = imageStateForPosterPreviewFromEditor(imageSize);
                clip._imageEditState = clip._posterImageState;
                clip._imageUrl = imageUrl;
                clip._imageAspectRatio = imageSize.width / Math.max(1, imageSize.height);
                syncMediaPreview(clip);
                const layer = getMediaLayer(clip, true);
                applyImageStateToLayer(layer, clip._posterImageState, imageUrl);
                if (layer) {
                    layer.firstChild.nodeValue = '';
                    layer.dataset.fixedRatio = 'true';
                    layer.dataset.aspectRatio = String(clip._imageAspectRatio);
                }
                await backupClipAssetToCloud(clip, input);
                activeImageEdit = null;
                document.body.classList.remove('image-editing');
                resetCutButton();
                resetFinishEditButton();
                updatePreviewPlaceholder();
            } catch (error) {
                resetFinishEditButton();
                alert(`編輯尚未完成：${error.message || '請稍後再試。'}`);
            }
        }

        async function finishVideoEdit() {
            if (!activeImageEdit) return;
            const { clip, input } = activeImageEdit;
            const state = imageEditStateFromControls();
            syncActiveVideoEditToPreview(state);
            await backupClipAssetToCloud(clip, input);
            activeImageEdit = null;
            document.body.classList.remove('image-editing');
            resetCutButton();
            resetFinishEditButton();
            updatePreviewPlaceholder();
        }

        function setupImageEditorInteractions() {
            const layer = document.getElementById('editorImageLayer');
            const preview = document.getElementById('imageEditorPreview');
            if (!layer || !preview) return;

            let state = null;

            layer.addEventListener('pointerdown', (event) => {
                if (!activeImageEdit) return;
                if (preview.dataset.viewportGesture === 'pinch') return;
                const previewRect = preview.getBoundingClientRect();
                const layerRect = layer.getBoundingClientRect();
                const screen = document.getElementById('imageEditorScreen');
                const isCropMode = screen?.classList.contains('crop-mode');
                const corner = event.target.dataset.corner;
                const resize = event.target.dataset.resize;
                const crop = event.target.dataset.crop;
                const cropEdge = event.target.dataset.cropEdge;
                const editState = imageEditStateFromControls();
                const pendingSelection = activeImageEdit.pendingCropSelection;
                const selectionStartX = clamp(((event.clientX - layerRect.left) / layerRect.width) * 100, 0, 100);
                const selectionStartY = clamp(((event.clientY - layerRect.top) / layerRect.height) * 100, 0, 100);

                if (isCropMode && pendingSelection && !cropEdge) {
                    event.preventDefault();
                    event.stopPropagation();
                    return;
                }

                state = {
                    mode: cropEdge ? 'crop-edge' : isCropMode && !pendingSelection && !corner && !resize && !crop ? 'crop-select' : corner ? 'corner' : resize ? 'resize' : crop ? 'crop' : 'move',
                    corner,
                    resize,
                    crop,
                    cropEdge,
                    pointerId: event.pointerId,
                    minBoxSize: event.pointerType === 'touch' ? 12 : 8,
                    pointerX: event.clientX,
                    pointerY: event.clientY,
                    previewWidth: previewRect.width,
                    previewHeight: previewRect.height,
                    layerLeft: layerRect.left,
                    layerTop: layerRect.top,
                    layerWidth: layerRect.width,
                    layerHeight: layerRect.height,
                    selectionStartX,
                    selectionStartY,
                    selection: null,
                    edgeSelection: pendingSelection ? { ...pendingSelection } : null,
                    editState
                };

                layer.setPointerCapture?.(event.pointerId);
                event.preventDefault();
                event.stopPropagation();
            });

            document.addEventListener('pointermove', (event) => {
                if (!state || event.pointerId !== state.pointerId || !activeImageEdit || preview.dataset.viewportGesture === 'pinch') return;
                const dxPercent = ((event.clientX - state.pointerX) / state.previewWidth) * 100;
                const dyPercent = ((event.clientY - state.pointerY) / state.previewHeight) * 100;
                const next = JSON.parse(JSON.stringify(state.editState));

                if (state.mode === 'move') {
                    next.box.left = clamp(state.editState.box.left + dxPercent, 0, 100 - state.editState.box.width);
                    next.box.top = clamp(state.editState.box.top + dyPercent, 0, 100 - state.editState.box.height);
                } else if (state.mode === 'corner') {
                    const point = next.corners[state.corner];
                    point.x = clamp(state.editState.corners[state.corner].x + dxPercent, 0, 100);
                    point.y = clamp(state.editState.corners[state.corner].y + dyPercent, 0, 100);
                } else if (state.mode === 'resize') {
                    if (state.resize.includes('e')) {
                        next.box.width = clamp(state.editState.box.width + dxPercent, state.minBoxSize, 100 - state.editState.box.left);
                    }
                    if (state.resize.includes('s')) {
                        next.box.height = clamp(state.editState.box.height + dyPercent, state.minBoxSize, 100 - state.editState.box.top);
                    }
                } else if (state.mode === 'crop') {
                    const cropDeltaX = ((event.clientX - state.pointerX) / Math.max(1, state.editState.box.width / 100 * state.previewWidth)) * 100;
                    const cropDeltaY = ((event.clientY - state.pointerY) / Math.max(1, state.editState.box.height / 100 * state.previewHeight)) * 100;
                    if (state.crop === 'left') {
                        next.crop.left = clamp(state.editState.crop.left + cropDeltaX, 0, 90 - state.editState.crop.right);
                    }
                    if (state.crop === 'right') {
                        next.crop.right = clamp(state.editState.crop.right - cropDeltaX, 0, 90 - state.editState.crop.left);
                    }
                    if (state.crop === 'top') {
                        next.crop.top = clamp(state.editState.crop.top + cropDeltaY, 0, 90 - state.editState.crop.bottom);
                    }
                    if (state.crop === 'bottom') {
                        next.crop.bottom = clamp(state.editState.crop.bottom - cropDeltaY, 0, 90 - state.editState.crop.top);
                    }
                } else if (state.mode === 'crop-select') {
                    const currentX = clamp(((event.clientX - state.layerLeft) / state.layerWidth) * 100, 0, 100);
                    const currentY = clamp(((event.clientY - state.layerTop) / state.layerHeight) * 100, 0, 100);
                    const left = Math.min(state.selectionStartX, currentX);
                    const top = Math.min(state.selectionStartY, currentY);
                    const width = Math.abs(currentX - state.selectionStartX);
                    const height = Math.abs(currentY - state.selectionStartY);
                    state.selection = { left, top, width, height };
                    renderCropSelection(state.selection);
                    event.preventDefault();
                    return;
                } else if (state.mode === 'crop-edge') {
                    const edgeDeltaX = ((event.clientX - state.pointerX) / state.layerWidth) * 100;
                    const edgeDeltaY = ((event.clientY - state.pointerY) / state.layerHeight) * 100;
                    state.selection = adjustedCropSelection(state.edgeSelection, state.cropEdge, edgeDeltaX, edgeDeltaY);
                    activeImageEdit.pendingCropSelection = state.selection;
                    renderCropSelection(state.selection);
                    event.preventDefault();
                    return;
                }

                activeImageEdit.state = next;
                syncEditorControlsFromState(next);
                renderImageEditor();
                event.preventDefault();
            });

            document.addEventListener('pointerup', (event) => {
                if (!state || event.pointerId !== state.pointerId) return;
                if (state?.mode === 'crop-select') {
                    if (state.selection && state.selection.width >= 3 && state.selection.height >= 3) {
                        activeImageEdit.pendingCropSelection = state.selection;
                        activeImageEdit.pendingCropBaseState = state.editState;
                        renderCropSelection(state.selection);
                    } else {
                        activeImageEdit.pendingCropSelection = null;
                        activeImageEdit.pendingCropBaseState = null;
                        renderCropSelection(null);
                    }
                }
                if (state?.mode === 'crop-edge' && state.selection) {
                    activeImageEdit.pendingCropSelection = state.selection;
                    activeImageEdit.pendingCropBaseState = state.editState;
                    renderCropSelection(state.selection);
                }
                state = null;
            });

            document.addEventListener('pointercancel', (event) => {
                if (!state || event.pointerId !== state.pointerId) return;
                state = null;
            });

            document.querySelectorAll('.image-editor-tools input[type="range"]').forEach((input) => {
