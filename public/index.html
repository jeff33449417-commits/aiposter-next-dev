<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Poster - 條形屏編排台</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="studio">
        <header class="studio-header">
            <h1 class="title">Ai Poster</h1>
            <div class="user-profile-badge" id="userProfileBadge" style="display:none">
                <span class="user-email" id="userEmail">載入中...</span>
                <span class="user-plan-badge" id="userPlan"></span>
                <button class="redeem-trigger-btn" id="redeemTriggerBtn" onclick="openRedeemModal()">兌換序號</button>
            </div>
        </header>

        <section class="preview-frame" aria-label="廣告機預覽">
            <div class="poster-preview" id="posterPreview">
                <div class="preview-placeholder">廣告機預覽 (860 x 86)</div>
            </div>
        </section>

        <section class="product-size-panel" aria-label="產品顯示尺寸">
            <label for="productSelect">產品尺寸</label>
            <select class="product-select" id="productSelect" onchange="handleProductChange(this.value)"></select>
            <span class="product-size-meta" id="productSizeMeta"></span>
        </section>

        <div class="arrange-row">
            <button class="action-btn preview-btn" id="previewBtn" onclick="toggleTimelinePreview()">預覽</button>
            <button class="action-btn arrange-btn" id="arrangeBtn" onclick="executeArrangement()">安排</button>
            <section class="export-jobs-panel" id="exportJobsPanel" aria-label="此次輸出工作狀態"></section>
        </div>

        <section class="ruler-row" aria-label="15 秒時間軸">
            <div class="timeline-ruler">
                <div class="ruler-line"></div>
                <div class="tick" style="left: 0%;">0s</div>
                <div class="tick" style="left: 33.33%;">5s</div>
                <div class="tick" style="left: 66.66%;">10s</div>
                <div class="tick" style="left: 100%;">15s</div>
                <div class="timeline-playhead" id="timelinePlayhead" aria-hidden="true"></div>
            </div>
        </section>

        <section class="material-board" aria-label="素材編排">
            <div class="material-row">
                <select class="effect-select" aria-label="文字入場特效" onchange="handleEffectSelect(this)">
                    <option>入場特效</option>
                    <option value="effect-typewriter">Typewriter</option>
                    <option value="effect-fade-up">Fade Up Characters</option>
                    <option value="effect-mask-reveal">Mask Reveal</option>
                    <option value="effect-light-sweep">CC Light Sweep</option>
                    <option value="effect-zoom-in">Zoom In & Pop</option>
                    <option value="effect-slide-in">Slide In</option>
                    <option value="effect-rotate-in">Rotate In</option>
                    <option value="add-text">在下方增加輸入文字框</option>
                    <option value="add-image">在下方增加上傳圖片框</option>
                    <option value="add-video">在下方增加上傳視頻框</option>
                </select>
                <div class="clip-lane">
                    <div class="content-slot timeline-clip" data-start="0" data-duration="15">
                        <span class="resize-handle resize-left" aria-hidden="true"></span>
                        <input class="content-input" type="text" placeholder="輸入文字" aria-label="輸入文字">
                        <div class="text-tools" aria-label="文字樣式">
                            <input class="text-color" type="color" value="#1d2554" title="文字顏色">
                            <select class="text-font" title="字型">
                                <option value='"Segoe UI", "Noto Sans TC", sans-serif'>黑體</option>
                                <option value='"Noto Serif TC", "Songti TC", serif'>宋體</option>
                                <option value='"Microsoft JhengHei", "Noto Sans TC", sans-serif'>微軟正黑</option>
                                <option value='"Bradley Hand", "Comic Sans MS", cursive'>手寫</option>
                                <option value='Impact, Haettenschweiler, sans-serif'>Impact</option>
                            </select>
                            <select class="text-weight" title="文字粗細">
                                <option value="400">細</option>
                                <option value="700">粗</option>
                                <option value="900" selected>黑</option>
                            </select>
                            <input class="text-size" type="range" value="24" min="8" max="86" step="1" title="字型大小">
                        </div>
                        <span class="resize-handle resize-right" aria-hidden="true"></span>
                    </div>
                </div>
                <select class="effect-select" aria-label="文字出場特效" onchange="handleEffectSelect(this)">
                    <option>出場特效</option>
                    <option value="effect-fade-out">Fade Out / Dissolve</option>
                    <option value="effect-slide-out">Fly Off / Slide Out</option>
                    <option value="effect-glitch-out">Glitch Out</option>
                    <option value="effect-particle">Particle Dissolve</option>
                    <option value="effect-stretch-out">Stretch Out</option>
                    <option value="effect-zoom-out">Zoom Out & Fade</option>
                    <option value="effect-spin-out">Spin Out</option>
                    <option value="effect-wipe-out">Wipe Out</option>
                    <option value="delete-row">刪除本框</option>
                </select>
            </div>

            <div class="material-row">
                <select class="effect-select" aria-label="圖片入場特效" onchange="handleEffectSelect(this)">
                    <option>入場特效</option>
                    <option value="effect-typewriter">Typewriter</option>
                    <option value="effect-fade-up">Fade Up Characters</option>
                    <option value="effect-mask-reveal">Mask Reveal</option>
                    <option value="effect-light-sweep">CC Light Sweep</option>
                    <option value="effect-zoom-in">Zoom In & Pop</option>
                    <option value="effect-slide-in">Slide In</option>
                    <option value="effect-rotate-in">Rotate In</option>
                    <option value="add-text">在下方增加輸入文字框</option>
                    <option value="add-image">在下方增加上傳圖片框</option>
                    <option value="add-video">在下方增加上傳視頻框</option>
                </select>
                <div class="clip-lane">
                    <div class="content-slot timeline-clip" data-start="0" data-duration="15">
                        <span class="resize-handle resize-left" aria-hidden="true"></span>
                        <input class="upload-input" id="imageUpload" type="file" accept="image/*" onchange="showFileName(this, 'imageLabel')">
                        <label class="upload-label" id="imageLabel" for="imageUpload">上傳圖片</label>
                        <span class="resize-handle resize-right" aria-hidden="true"></span>
                    </div>
                </div>
                <select class="effect-select" aria-label="圖片出場特效" onchange="handleEffectSelect(this)">
                    <option>出場特效</option>
                    <option value="effect-fade-out">Fade Out / Dissolve</option>
                    <option value="effect-slide-out">Fly Off / Slide Out</option>
                    <option value="effect-glitch-out">Glitch Out</option>
                    <option value="effect-particle">Particle Dissolve</option>
                    <option value="effect-stretch-out">Stretch Out</option>
                    <option value="effect-zoom-out">Zoom Out & Fade</option>
                    <option value="effect-spin-out">Spin Out</option>
                    <option value="effect-wipe-out">Wipe Out</option>
                    <option value="delete-row">刪除本框</option>
                </select>
            </div>

            <div class="material-row">
                <select class="effect-select" aria-label="視頻入場特效" onchange="handleEffectSelect(this)">
                    <option>入場特效</option>
                    <option value="effect-typewriter">Typewriter</option>
                    <option value="effect-fade-up">Fade Up Characters</option>
                    <option value="effect-mask-reveal">Mask Reveal</option>
                    <option value="effect-light-sweep">CC Light Sweep</option>
                    <option value="effect-zoom-in">Zoom In & Pop</option>
                    <option value="effect-slide-in">Slide In</option>
                    <option value="effect-rotate-in">Rotate In</option>
                    <option value="add-text">在下方增加輸入文字框</option>
                    <option value="add-image">在下方增加上傳圖片框</option>
                    <option value="add-video">在下方增加上傳視頻框</option>
                </select>
                <div class="clip-lane">
                    <div class="content-slot timeline-clip" data-start="0" data-duration="15">
                        <span class="resize-handle resize-left" aria-hidden="true"></span>
                        <input class="upload-input" id="videoUpload" type="file" accept="video/*" onchange="showFileName(this, 'videoLabel')">
                        <label class="upload-label" id="videoLabel" for="videoUpload">上傳視頻</label>
                        <span class="resize-handle resize-right" aria-hidden="true"></span>
                    </div>
                </div>
                <select class="effect-select" aria-label="視頻出場特效" onchange="handleEffectSelect(this)">
                    <option>出場特效</option>
                    <option value="effect-fade-out">Fade Out / Dissolve</option>
                    <option value="effect-slide-out">Fly Off / Slide Out</option>
                    <option value="effect-glitch-out">Glitch Out</option>
                    <option value="effect-particle">Particle Dissolve</option>
                    <option value="effect-stretch-out">Stretch Out</option>
                    <option value="effect-zoom-out">Zoom Out & Fade</option>
                    <option value="effect-spin-out">Spin Out</option>
                    <option value="effect-wipe-out">Wipe Out</option>
                    <option value="delete-row">刪除本框</option>
                </select>
            </div>
        </section>
    </main>

    <section class="image-editor-screen" id="imageEditorScreen" aria-label="圖片編輯">
        <h1 class="editor-title" id="mediaEditorTitle">圖片編輯</h1>

        <div class="editor-preview-frame">
            <div class="poster-preview" id="imageEditorPreview">
                <div class="preview-placeholder">廣告機預覽 (860 x 86)</div>
                <div class="editor-image-layer" id="editorImageLayer">
                    <div class="editor-image-content" id="editorImageContent"></div>
                    <video class="editor-video-content" id="editorVideoContent" muted loop playsinline></video>
                    <span class="editor-resize-handle resize-e" data-resize="e" aria-hidden="true"></span>
                    <span class="editor-resize-handle resize-s" data-resize="s" aria-hidden="true"></span>
                    <span class="editor-resize-handle resize-se" data-resize="se" aria-hidden="true"></span>
                    <span class="editor-crop-handle crop-left" data-crop="left" aria-hidden="true"></span>
                    <span class="editor-crop-handle crop-top" data-crop="top" aria-hidden="true"></span>
                    <span class="editor-crop-handle crop-right" data-crop="right" aria-hidden="true"></span>
                    <span class="editor-crop-handle crop-bottom" data-crop="bottom" aria-hidden="true"></span>
                    <span class="editor-crop-selection" id="editorCropSelection" aria-hidden="true">
                        <span class="crop-selection-edge crop-selection-edge-left" data-crop-edge="left"></span>
                        <span class="crop-selection-edge crop-selection-edge-top" data-crop-edge="top"></span>
                        <span class="crop-selection-edge crop-selection-edge-right" data-crop-edge="right"></span>
                        <span class="crop-selection-edge crop-selection-edge-bottom" data-crop-edge="bottom"></span>
                    </span>
                    <span class="corner-handle corner-tl" data-corner="tl" aria-hidden="true"></span>
                    <span class="corner-handle corner-tr" data-corner="tr" aria-hidden="true"></span>
                    <span class="corner-handle corner-br" data-corner="br" aria-hidden="true"></span>
                    <span class="corner-handle corner-bl" data-corner="bl" aria-hidden="true"></span>
                </div>
                <div class="editor-safe-frame" aria-hidden="true"></div>
            </div>
        </div>

        <div class="image-editor-tools">
            <section class="tool-panel">
                <h2>圖片裁切</h2>
                <label class="tool-row">左側 <input id="cropLeft" type="range" min="0" max="45" value="0"></label>
                <label class="tool-row">上方 <input id="cropTop" type="range" min="0" max="45" value="0"></label>
                <label class="tool-row">右側 <input id="cropRight" type="range" min="0" max="45" value="0"></label>
                <label class="tool-row">下方 <input id="cropBottom" type="range" min="0" max="45" value="0"></label>
            </section>

            <section class="tool-panel">
                <h2>圖片大小</h2>
                <label class="tool-row">寬度 <input id="imageWidth" type="range" min="8" max="100" value="40"></label>
                <label class="tool-row">高度 <input id="imageHeight" type="range" min="8" max="100" value="70"></label>
                <label class="tool-row">位置 X <input id="imagePosX" type="range" min="0" max="100" value="30"></label>
                <label class="tool-row">位置 Y <input id="imagePosY" type="range" min="0" max="100" value="15"></label>
            </section>

            <section class="tool-panel">
                <h2>四角任意變形</h2>
                <label class="tool-row">左上 X <input id="cornerTlX" type="range" min="0" max="45" value="0"></label>
                <label class="tool-row">左上 Y <input id="cornerTlY" type="range" min="0" max="45" value="0"></label>
                <label class="tool-row">右上 X <input id="cornerTrX" type="range" min="55" max="100" value="100"></label>
                <label class="tool-row">右上 Y <input id="cornerTrY" type="range" min="0" max="45" value="0"></label>
            </section>

            <section class="tool-panel">
                <h2>四角任意變形</h2>
                <label class="tool-row">右下 X <input id="cornerBrX" type="range" min="55" max="100" value="100"></label>
                <label class="tool-row">右下 Y <input id="cornerBrY" type="range" min="55" max="100" value="100"></label>
                <label class="tool-row">左下 X <input id="cornerBlX" type="range" min="0" max="45" value="0"></label>
                <label class="tool-row">左下 Y <input id="cornerBlY" type="range" min="55" max="100" value="100"></label>
            </section>

            <div class="editor-actions">
                <button class="editor-action-btn" id="cutModeBtn" type="button" onclick="toggleCutMode()">切割</button>
                <button class="editor-action-btn" type="button" onclick="cancelImageEdit()">取消</button>
                <button class="editor-action-btn primary" id="finishImageEditBtn" type="button" onclick="finishImageEdit()">編輯完成</button>
            </div>
        </div>
    </section>

    <div class="modal-overlay" id="redeemModal" aria-hidden="true" style="display:none">
        <div class="modal-card">
            <div class="modal-card-header">
                <h3>兌換商用邀請碼 / 體驗序號</h3>
                <button class="modal-close-btn" onclick="closeRedeemModal()">×</button>
            </div>
            <div class="modal-card-body">
                <p class="modal-tip">請輸入您的 VIP 邀請碼，兌換成功後將立即升級您的方案與每日輸出配額。</p>
                <div class="modal-input-row">
                    <input type="text" id="redeemCodeInput" placeholder="例如: BUSINESS_PRO_XYZ" autocomplete="off">
                </div>
                <div class="modal-message" id="redeemMessage"></div>
            </div>
            <div class="modal-card-footer">
                <button class="modal-btn secondary" onclick="closeRedeemModal()">取消</button>
                <button class="modal-btn primary" id="redeemSubmitBtn" onclick="submitRedeemCode()">立即兌換</button>
            </div>
        </div>
    </div>

    <script src="/js/products.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
